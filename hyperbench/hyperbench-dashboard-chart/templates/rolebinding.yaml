apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-crd-reader
  namespace: {{ .Values.workbenchNamespace }}
  labels:
    {{- include "hyperbench-dashboard.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: dashboard
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: dashboard-crd-reader
  apiGroup: rbac.authorization.k8s.io
